<div class="create-employee-container">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-8">
      <div class="card create-employee-card">
        <div class="card-header card-header-custom">
          <h3><i class="fas fa-user-plus me-2"></i>Create New Employee</h3>
          <p>Add a new employee to the system</p>
        </div>
        
        <div class="card-body card-body-custom">
          <!-- Success/Error Message -->
          <div *ngIf="message" 
               [class]="'alert alert-custom ' + (messageType === 'success' ? 'alert-success-custom' : 'alert-error-custom')"
               role="alert">
            <div class="d-flex align-items-center">
              <i [class]="messageType === 'success' ? 'fas fa-check-circle me-2' : 'fas fa-exclamation-triangle me-2'"></i>
              <span>{{ message }}</span>
            </div>
          </div>

          <form (ngSubmit)="onCreateEmployee()" #employeeForm="ngForm">
            <!-- Employee Name -->
            <div class="form-group-custom">
              <label for="employee_name" class="form-label-custom required-field">
                Employee Name
              </label>
              <input type="text" 
                     class="form-control form-control-custom" 
                     id="employee_name"
                     name="employee_name"
                     [(ngModel)]="employeeData.employee_name"
                     required
                     placeholder="Enter employee name">
              <div class="form-text-custom">
                Full name of the employee
              </div>
            </div>

            <!-- Employee Amount -->
            <div class="form-group-custom">
              <label for="employee_amount" class="form-label-custom required-field">
                Employee Amount
              </label>
              <input type="number" 
                     class="form-control form-control-custom" 
                     id="employee_amount"
                     name="employee_amount"
                     [(ngModel)]="employeeData.employee_amount"
                     required
                     min="0"
                     step="0.01"
                     placeholder="0.00">
              <div class="form-text-custom">
                Salary or amount for the employee
              </div>
            </div>

            <!-- Insert Date with Kendo DatePicker -->
            <div class="form-group-custom">
              <label for="insert_date" class="form-label-custom">
                Insert Date
              </label>
              <kendo-datepicker
                class="form-control-custom kendo-datepicker-custom"
                id="insert_date"
                name="insert_date"
                [(ngModel)]="employeeData.insert_date"
                [format]="'yyyy-MM-dd'"
                placeholder="Select date">
              </kendo-datepicker>
              <div class="form-text-custom">
                Select the employee record creation date
              </div>
            </div>

            <!-- Employee Description -->
            <div class="form-group-custom">
              <label for="employee_descripation" class="form-label-custom">
                Description
              </label>
              <textarea
                     class="form-control form-control-custom" 
                     id="employee_descripation"
                     name="employee_descripation"
                     [(ngModel)]="employeeData.employee_descripation"
                     rows="3"
                     placeholder="Enter employee description, role, or notes..."></textarea>
              <div class="form-text-custom">
                Optional description about the employee
              </div>
            </div>

            <!-- Submit Button -->
            <div class="form-group-custom">
              <button type="submit" 
                      class="btn btn-create-employee"
                      [disabled]="isLoading">
                <span *ngIf="isLoading" class="loading-spinner"></span>
                {{ isLoading ? 'Creating Employee...' : 'Create Employee' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
