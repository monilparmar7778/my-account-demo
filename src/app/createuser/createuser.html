<div class="create-user-container" >
  <div class="row justify-content-center">
    <div class="col-12 col-xl-8">
      <div class="card create-user-card">
        <div class="card-header card-header-custom">
          <h3><i class="fas fa-user-plus me-2"></i>Create New User</h3>
          <p>Add a new user to the system</p>
        </div>
        
        <div class="card-body card-body-custom">
          <!-- Success/Error Message -->
          <div *ngIf="message" 
               [class]="'alert alert-custom ' + (messageType === 'success' ? 'alert-success-custom' : 'alert-error-custom')"
               role="alert">
            <div class="d-flex align-items-center">
              <i [class]="messageType === 'success' ? 'fas fa-check-circle me-2' : 'fas fa-exclamation-triangle me-2'"></i>
              <span>{{ message }}</span>
            </div>
          </div>

          <form (ngSubmit)="onCreateUser()" #userForm="ngForm">
            <!-- Username -->
            <div class="form-group-custom">
              <label for="username" class="form-label-custom required-field">
                Username
              </label>
              <input type="text" 
                     class="form-control form-control-custom" 
                     id="username"
                     name="username"
                     [(ngModel)]="userData.username"
                     required
                     placeholder="Enter username">
              <div class="form-text-custom">
                Username must be unique
              </div>
            </div>

            <!-- Email -->
            <div class="form-group-custom">
              <label for="email" class="form-label-custom required-field">
                Email Address
              </label>
              <input type="email" 
                     class="form-control form-control-custom" 
                     id="email"
                     name="email"
                     [(ngModel)]="userData.email"
                     required
                     placeholder="user@example.com">
            </div>

            <!-- Full Name & Mobile in Row -->
            <div class="form-row-custom">
              <!-- Full Name -->
              <div class="form-group-custom">
                <label for="full_name" class="form-label-custom">
                  Full Name
                </label>
                <input type="text" 
                       class="form-control form-control-custom" 
                       id="full_name"
                       name="full_name"
                       [(ngModel)]="userData.full_name"
                       placeholder="John Doe">
              </div>

              <!-- Mobile Number -->
              <div class="form-group-custom">
                <label for="mobile_no" class="form-label-custom">
                  Mobile Number
                </label>
                <input type="tel" 
                       class="form-control form-control-custom" 
                       id="mobile_no"
                       name="mobile_no"
                       [(ngModel)]="userData.mobile_no"
                       placeholder="+1 234 567 8900">
              </div>
            </div>

            <!-- Submit Button -->
            <div class="form-group-custom">
              <button type="submit" 
                      class="btn btn-create-user"
                      [disabled]="isLoading">
                <span *ngIf="isLoading" class="loading-spinner"></span>
                {{ isLoading ? 'Creating User...' : 'Create User' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
